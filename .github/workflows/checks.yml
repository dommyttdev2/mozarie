name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: 静的確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m compileall -q server.py updater.py setup_gpu_check.py mozarie
      - run: python -c "import ast; from pathlib import Path; ast.parse(Path('mozarie/http.py').read_text(encoding='utf-8'))"
      - run: python -c "import json; [json.load(open(path, encoding='utf-8')) for path in ('config/defaults.json', 'static/i18n/ja.json', 'static/i18n/en.json')]"
      - run: find static/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  http-import:
    name: HTTP module import
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: numpy Pillow opencv-python
      - run: python -m unittest discover -s tests -t . -p "test_*.py"
      - run: node tests/test_save_source_snapshot_contract.cjs
