name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-test.txt
      - run: node scripts/test-quiet.cjs backend --artifacts "${{ runner.temp }}/mozarie-coverage"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: ${{ runner.temp }}/mozarie-coverage/backend/coverage.xml
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node scripts/test-quiet.cjs frontend --artifacts "${{ runner.temp }}/mozarie-coverage"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: ${{ runner.temp }}/mozarie-coverage/frontend/report/coverage-final.json
          if-no-files-found: error
