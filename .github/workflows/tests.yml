name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m coverage run -m unittest discover -s tests -t .
      - run: python -m coverage report --fail-under=80
      - if: always()
        run: python -m coverage xml
      - if: always()
        run: >-
          python -c "import xml.etree.ElementTree as e; n={x.get('filename').replace('\\','/') for x in e.parse('coverage.xml').iter('class')}; m={'server.py','updater.py','setup_gpu_check.py'}-n; assert not m, f'missing root coverage: {sorted(m)}'"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm test
