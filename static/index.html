<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app.title">Lets Censoring</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" data-i18n="app.brand">Lets Censoring</div>
    <div class="folder-control">
      <label for="folderPath" data-i18n="folder.label">画像フォルダ</label>
      <input id="folderPath" type="text" autocomplete="off" spellcheck="false" placeholder="G:\Images\work">
      <button id="pickFolder" data-i18n="folder.browse">参照...</button>
      <button id="loadFolder" class="primary" data-i18n="folder.load">読み込む</button>
    </div>
    <div class="job-status">
      <div id="status" class="status" aria-live="polite" data-i18n="status.chooseFolder">フォルダを選択してください</div>
      <progress id="jobProgress" value="0" max="1" hidden data-i18n-aria-label="status.progress" aria-label="処理状況"></progress>
    </div>
  </header>

  <main class="studio-grid">
    <aside class="gallery-pane" data-i18n-aria-label="gallery.aria">
      <div class="pane-heading gallery-heading">
        <div>
          <h2 data-i18n="gallery.title">画像</h2>
          <span id="imageCount" class="muted">0件</span>
        </div>
        <div class="gallery-heading-actions">
          <button id="clearAllMasksButton" class="text-button" data-i18n="gallery.clearAllMasks">全画像のモザイククリア</button>
          <button id="selectAllButton" class="text-button" data-i18n="gallery.selectAll">全選択</button>
        </div>
      </div>
      <div class="gallery-actions">
        <button id="detectAllButton" class="primary wide" data-i18n="gallery.detectAll">全画像を自動検出</button>
        <button id="clearCatalogButton" class="text-button wide" data-i18n="gallery.clearCatalog">画像一覧をクリア</button>
      </div>
      <div id="gallery" class="gallery" data-i18n-aria-label="gallery.drop">画像をドロップして追加</div>
      <div class="gallery-footer">
        <span id="selectedCount" class="muted">選択中 0件</span>
        <button id="applyButton" class="primary wide" disabled data-i18n="gallery.applySelected">選択画像にモザイクを適用</button>
      </div>
    </aside>

    <section class="editor-pane" data-i18n-aria-label="editor.aria">
      <div class="editor-toolbar">
        <div class="tool-group" role="group" data-i18n-aria-label="editor.tools" aria-label="編集ツール">
          <button id="brushTool" class="tool active" data-i18n="editor.brush" data-i18n-title="editor.brush">ブラシ</button>
          <button id="eraserTool" class="tool" data-i18n="editor.eraser" data-i18n-title="editor.eraser">消しゴム</button>
          <button id="boundaryTool" class="tool" data-i18n="editor.boundary" data-i18n-title="editor.boundary">境界</button>
          <button id="fitButton" class="tool" data-i18n="editor.fit" data-i18n-title="editor.fit">全体表示</button>
          <button id="undoButton" class="tool" data-i18n="editor.undo" data-i18n-title="editor.undo">元に戻す</button>
          <button id="redoButton" class="tool" data-i18n="editor.redo" data-i18n-title="editor.redo">やり直す</button>
          <button id="detectCurrentButton" class="tool detect-current" disabled data-i18n="editor.detectCurrent">自動検出</button>
          <button id="clearCurrentMasksButton" class="tool" disabled data-i18n="editor.clearMasks">モザイククリア</button>
        </div>
        <div class="numeric-controls">
          <label class="numeric-control" for="brushSize">
            <span data-i18n="editor.brushSize">ブラシ径</span>
            <input id="brushSize" type="range" min="2" max="500" value="48">
            <output id="brushSizeValue">48 px</output>
          </label>
          <label class="numeric-control block-control" for="blockSize">
            <span data-i18n="editor.blockSize">モザイク粗さ</span>
            <input id="blockSize" type="number" min="1" max="2048" value="4">
            <output>px</output>
          </label>
        </div>
        <button id="saveButton" class="primary save" disabled data-i18n="editor.applyCurrent">モザイクを適用</button>
      </div>
      <div id="canvasStage" class="canvas-stage">
        <canvas id="editorCanvas" data-i18n-aria-label="editor.canvas" aria-label="画像編集キャンバス"></canvas>
        <div id="emptyState" class="empty-state" data-i18n="editor.empty">左の画像を選択してください</div>
      </div>
      <div class="editor-footer">
        <span id="imageInfo" data-i18n="editor.none">画像未選択</span>
        <span data-i18n="editor.shortcuts">スペースキー: 移動 / ホイール: 拡大・縮小 / Shiftキー+ホイール: ブラシ径</span>
      </div>
    </section>

    <aside class="candidate-pane" data-i18n-aria-label="candidates.aria">
      <section class="detection-settings">
        <h2 data-i18n="detection.title">検出設定</h2>
        <label class="threshold-control" for="confidence">
          <span data-i18n="detection.confidence">判定しきい値</span>
          <output id="confidenceValue">0.60</output>
        </label>
        <input id="confidence" type="range" min="0.30" max="0.90" step="0.05" value="0.60">
        <p class="muted" data-i18n="detection.help">高くすると誤検出を減らします。</p>
      </section>
      <div class="pane-heading candidates-heading">
        <div>
          <h2 data-i18n="candidates.title">検出候補</h2>
          <span id="candidateStatus" class="muted" data-i18n="candidates.unselected">画像を選択してください</span>
        </div>
      </div>
      <div id="candidateList" class="candidate-list"></div>
    </aside>
  </main>

  <template id="galleryItemTemplate">
    <article class="gallery-item">
      <label class="gallery-check"><input type="checkbox"><span></span></label>
      <img loading="lazy" alt="">
      <div class="gallery-name"></div>
      <div class="gallery-meta"></div>
    </article>
  </template>

  <dialog id="confirmDialog" class="modal-dialog confirm-dialog">
    <form method="dialog" class="dialog-body">
      <h2 id="confirmTitle"></h2>
      <p id="confirmMessage"></p>
      <div class="dialog-actions">
        <button value="cancel" data-i18n="dialog.cancel">キャンセル</button>
        <button id="confirmAccept" value="confirm" class="danger" data-i18n="dialog.confirm">実行</button>
      </div>
    </form>
  </dialog>

  <dialog id="applyDialog" class="modal-dialog apply-dialog">
    <form id="applyForm" class="dialog-body">
      <h2 data-i18n="apply.title">モザイクを適用</h2>
      <p id="applyTargetCount" class="muted"></p>
      <fieldset id="applySettings">
        <label class="choice-row"><input type="radio" name="saveMode" value="copy" checked><span data-i18n="apply.copy">コピー保存</span></label>
        <label class="choice-row"><input type="radio" name="saveMode" value="overwrite"><span data-i18n="apply.overwrite">元画像を上書き</span></label>
        <label class="form-row"><span data-i18n="apply.prefix">ファイル名の先頭</span><input id="applyPrefix" type="text" value="censored_" required></label>
        <label id="deleteOriginalRow" class="choice-row"><input id="deleteOriginal" type="checkbox"><span data-i18n="apply.deleteOriginal">コピー成功後に元画像を削除</span></label>
        <label class="form-row"><span data-i18n="editor.blockSize">モザイク粗さ</span><input id="applyBlockSize" type="number" min="1" max="2048" value="4" required></label>
        <p class="fixed-note" data-i18n="apply.metadata">メタデータは保持・検証します。同名時は自動連番です。</p>
      </fieldset>
      <section id="applyProgressPanel" hidden>
        <p id="applyCurrentName" class="truncate"></p>
        <progress id="applyProgress" value="0" max="1"></progress>
        <p id="applyProgressText" class="muted"></p>
      </section>
      <p id="applyResult" class="dialog-result" aria-live="polite"></p>
      <div class="dialog-actions">
        <button id="applyCloseButton" type="button" data-i18n="dialog.close">閉じる</button>
        <button id="applyPauseButton" type="button" hidden data-i18n="apply.pause">一時停止</button>
        <button id="applyCancelButton" type="button" hidden class="danger" data-i18n="dialog.cancelJob">キャンセル</button>
        <button id="applyStartButton" type="submit" class="primary" data-i18n="apply.start">適用</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
