<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app.title">Lets Censoring</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" data-i18n="app.brand">Lets Censoring</div>
    <div class="folder-control">
      <label for="folderPath" data-i18n="folder.label">画像フォルダ</label>
      <input id="folderPath" type="text" autocomplete="off" spellcheck="false" placeholder="G:\Images\work">
      <div class="picker-anchor">
        <button id="pickFolder" type="button" popovertarget="pickerMenu" data-i18n="folder.browse">画像を追加</button>
        <div id="pickerMenu" class="picker-menu" popover>
          <button id="pickImages" type="button" data-i18n="folder.pickImages">画像ファイルを選択</button>
          <button id="pickFolderFiles" type="button" data-i18n="folder.pickFolder">フォルダーを選択</button>
        </div>
        <input id="importImagesInput" type="file" multiple accept=".png,.jpg,.jpeg,.webp" hidden>
        <input id="importFolderInput" type="file" webkitdirectory multiple accept=".png,.jpg,.jpeg,.webp" hidden>
      </div>
      <button id="loadFolder" class="primary" data-i18n="folder.load">フォルダーを読み込む</button>
    </div>
    <div class="job-status">
      <div id="status" class="status" aria-live="polite" data-i18n="status.chooseFolder">フォルダを選択してください</div>
      <div class="job-progress-row">
        <progress id="jobProgress" value="0" max="1" hidden data-i18n-aria-label="status.progress" aria-label="処理状況"></progress>
        <output id="jobProgressText" hidden aria-live="polite"></output>
      </div>
    </div>
  </header>

  <main class="studio-grid">
    <aside class="gallery-pane" data-i18n-aria-label="gallery.aria">
      <div class="pane-heading gallery-heading">
        <div>
          <h2 data-i18n="gallery.title">画像</h2>
          <span id="imageCount" class="muted">0件</span>
        </div>
        <div class="gallery-heading-actions">
          <button id="overviewButton" class="text-button" type="button" data-i18n="navigation.overview">一覧表示</button>
        </div>
      </div>
      <div class="gallery-tabs" data-i18n-aria-label="gallery.tabs" aria-label="画像一覧の表示">
        <button id="galleryAllTab" class="gallery-tab active" aria-pressed="true" data-i18n="gallery.tabAll">すべて</button>
        <button id="galleryMaskedTab" class="gallery-tab" aria-pressed="false" data-i18n="gallery.tabMasked">モザイクあり</button>
      </div>
      <div id="gallery" class="gallery" data-i18n-aria-label="gallery.drop">画像をドロップして追加</div>
    </aside>

    <section class="editor-pane" data-i18n-aria-label="editor.aria">
      <div class="editor-toolbar">
        <div class="tool-group" data-i18n-aria-label="editor.tools" aria-label="編集ツール">
          <button id="brushTool" class="tool active" data-i18n="editor.brush" data-i18n-title="editor.brush">ブラシ</button>
          <button id="eraserTool" class="tool" data-i18n="editor.eraser" data-i18n-title="editor.eraser">消しゴム</button>
          <button id="boundaryTool" class="tool" data-i18n="editor.boundary" data-i18n-title="editor.boundary">境界</button>
          <button id="fitButton" class="tool" data-i18n="editor.fit" data-i18n-title="editor.fit">全体表示</button>
          <button id="undoButton" class="tool" data-i18n="editor.undo" data-i18n-title="editor.undo">元に戻す</button>
          <button id="redoButton" class="tool" data-i18n="editor.redo" data-i18n-title="editor.redo">やり直す</button>
          <button id="mosaicPreviewButton" class="tool active" type="button" aria-pressed="true" data-i18n="editor.mosaicPreview" data-i18n-title="editor.mosaicPreviewHelp">モザイク表示</button>
        </div>
        <div class="tool-group command-actions" data-i18n-aria-label="editor.currentActions" aria-label="現在の画像">
          <button id="detectCurrentButton" class="tool detect-current" disabled data-i18n="editor.detectCurrent">自動検出</button>
          <button id="clearCurrentMasksButton" class="tool" disabled data-i18n="editor.clearMasks">候補を消去</button>
        </div>
        <div class="numeric-controls">
          <label class="numeric-control" for="brushSize">
            <span data-i18n="editor.brushSize">ブラシ径</span>
            <input id="brushSize" type="range" min="2" max="500" value="48">
            <output id="brushSizeValue">48 px</output>
          </label>
          <label class="numeric-control block-control" for="divisor">
            <span data-i18n="editor.blockSize">モザイク粗さ</span>
            <span class="ratio-prefix">1 /</span>
            <input id="divisor" type="number" min="1" max="10000" value="100">
            <output id="blockSizeValue">-</output>
          </label>
        </div>
        <button id="saveButton" class="primary save" disabled data-i18n="editor.applyCurrent">ファイル保存</button>
      </div>
      <div id="canvasStage" class="canvas-stage">
        <canvas id="editorCanvas" tabindex="0" data-i18n-aria-label="editor.canvas" aria-label="画像編集キャンバス"></canvas>
        <div id="emptyState" class="empty-state" data-i18n="editor.empty">左の画像を選択してください</div>
      </div>
      <div class="editor-footer">
        <span id="imageInfo" data-i18n="editor.none">画像未選択</span>
        <output id="reviewStatus" class="review-status" data-i18n="review.unreviewed">未確認</output>
        <div class="navigation-controls" data-i18n-aria-label="navigation.aria" aria-label="画像移動">
          <button id="previousImageButton" class="icon-button" type="button" title="前へ" aria-label="前へ" data-i18n-title="navigation.previous" data-i18n-aria-label="navigation.previous">‹</button>
          <output id="imagePosition" class="image-position">- / -</output>
          <button id="nextImageButton" class="icon-button" type="button" title="次へ" aria-label="次へ" data-i18n-title="navigation.next" data-i18n-aria-label="navigation.next">›</button>
          <button id="nextUnreviewedButton" class="text-button" type="button" data-i18n="navigation.nextUnreviewed">次の未確認</button>
          <button id="reviewAndNextButton" class="text-button" type="button" data-i18n="navigation.reviewAndNext">確認済みにして次へ</button>
          <label class="shortcut-toggle"><input id="navigationShortcutsEnabled" type="checkbox" checked><span data-i18n="navigation.shortcuts">ナビゲーションショートカット</span></label>
        </div>
      </div>
    </section>

    <aside class="candidate-pane" data-i18n-aria-label="candidates.aria">
      <section class="detection-settings">
        <h2 data-i18n="detection.title">検出設定</h2>
        <label class="threshold-control" for="confidence">
          <span data-i18n="detection.confidence">判定しきい値</span>
          <output id="confidenceValue">0.50</output>
        </label>
        <input id="confidence" type="range" min="0.10" max="0.90" step="0.01" value="0.50">
        <p class="muted" data-i18n="detection.help">高くすると誤検出を減らします。</p>
      </section>
      <div class="pane-heading candidates-heading">
        <div>
          <h2 data-i18n="candidates.title">検出候補</h2>
          <span id="candidateStatus" class="muted" data-i18n="candidates.unselected">画像を選択してください</span>
        </div>
      </div>
      <div id="candidateList" class="candidate-list"></div>
    </aside>

    <section id="overviewPane" class="overview-pane" tabindex="-1" hidden data-i18n-aria-label="overview.aria" aria-label="画像一覧">
      <header class="overview-toolbar">
        <div class="overview-heading">
          <button id="closeOverviewButton" class="text-button" type="button" data-i18n="overview.back">編集に戻る</button>
          <h2 data-i18n="overview.title">画像一覧</h2>
          <output id="overviewCount" class="muted">0 / 0</output>
        </div>
        <div class="overview-filters" role="tablist" data-i18n-aria-label="overview.filters" aria-label="一覧の絞り込み">
          <button class="overview-filter active" type="button" data-overview-filter="all" role="tab" aria-selected="true" data-i18n="overview.filterAll">全体</button>
          <button class="overview-filter" type="button" data-overview-filter="unreviewed" role="tab" aria-selected="false" data-i18n="overview.filterUnreviewed">未確認</button>
          <button class="overview-filter" type="button" data-overview-filter="reviewed" role="tab" aria-selected="false" data-i18n="overview.filterReviewed">確認済み</button>
          <button class="overview-filter" type="button" data-overview-filter="masked" role="tab" aria-selected="false" data-i18n="overview.filterMasked">モザイク適用済</button>
        </div>
        <div class="overview-search-controls">
          <input id="overviewQuery" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="overview.searchPlaceholder" placeholder="ファイル名・相対パスを検索">
          <select id="overviewFolder" data-i18n-aria-label="overview.folder" aria-label="フォルダで絞り込み"></select>
        </div>
      </header>
      <div id="overviewGrid" class="overview-grid"></div>
    </section>
  </main>

  <footer class="batch-bar" aria-label="全画像の操作">
    <output id="batchImageCount" class="batch-count">0件</output>
    <button id="detectAllButton" type="button" data-i18n="gallery.detectAll">全画像を自動検出</button>
    <button id="saveAllButton" class="primary" type="button" data-i18n="gallery.saveAll">対象画像を保存...</button>
    <button id="batchMoreButton" type="button" popovertarget="batchMoreMenu" aria-expanded="false" data-i18n="batch.clear">一括クリア</button>
    <div id="batchMoreMenu" class="batch-more-menu" popover>
      <button id="clearAllMasksButton" class="danger" type="button" data-i18n="gallery.clearAllMasks">全画像のモザイク指定をクリア...</button>
      <button id="clearCatalogButton" class="danger" type="button" data-i18n="gallery.clearCatalog">読み込んだ画像をすべてクリア...</button>
    </div>
  </footer>

  <template id="galleryItemTemplate">
    <article class="gallery-item">
      <img loading="lazy" alt="">
      <span class="gallery-review-badge"></span>
      <div class="gallery-name"></div>
      <div class="gallery-meta"></div>
    </article>
  </template>

  <template id="overviewItemTemplate">
    <button class="overview-item" type="button">
      <img loading="lazy" alt="">
      <span class="overview-item-name"></span>
      <span class="overview-item-path"></span>
      <span class="overview-item-state"></span>
    </button>
  </template>

  <dialog id="confirmDialog" class="modal-dialog confirm-dialog">
    <form method="dialog" class="dialog-body">
      <h2 id="confirmTitle"></h2>
      <p id="confirmMessage"></p>
      <div class="dialog-actions">
        <button value="cancel" data-i18n="dialog.cancel">キャンセル</button>
        <button id="confirmAccept" value="confirm" class="danger" data-i18n="dialog.confirm">実行</button>
      </div>
    </form>
  </dialog>

  <dialog id="detectDialog" class="modal-dialog detect-dialog">
    <form id="detectForm" class="dialog-body">
      <h2 data-i18n="detectDialog.title">自動検出の設定</h2>
      <p id="detectTargetCount" class="muted"></p>
      <label class="form-row">
        <span data-i18n="detection.confidence">判定しきい値</span>
        <span class="threshold-dialog-control">
          <input id="detectConfidenceRange" type="range" min="0.10" max="0.90" step="0.01" value="0.50">
          <input id="detectConfidenceNumber" type="number" min="0.10" max="0.90" step="0.01" value="0.50">
        </span>
      </label>
      <p class="fixed-note" data-i18n="detectDialog.help">高いほど誤検出は減りますが、見逃しは増えます。</p>
      <p class="fixed-note" data-i18n="detectDialog.rerunNote">再検出では自動候補だけを置き換え、境界候補と手描きの範囲は残ります。</p>
      <div class="dialog-actions">
        <button id="detectCancelButton" type="button" data-i18n="dialog.cancel">キャンセル</button>
        <button id="detectStartButton" type="submit" class="primary" data-i18n="detectDialog.start">検出を開始</button>
      </div>
    </form>
  </dialog>

  <dialog id="applyDialog" class="modal-dialog apply-dialog">
    <form id="applyForm" class="dialog-body">
      <h2 data-i18n="apply.title">ファイルを保存</h2>
      <p id="applyTargetCount" class="muted"></p>
      <fieldset id="applySettings">
        <label class="choice-row"><input id="applyCopyMode" type="radio" name="saveMode" value="copy" checked><span data-i18n="apply.copy">コピー保存</span></label>
        <label id="applyOverwriteRow" class="choice-row"><input id="applyOverwriteMode" type="radio" name="saveMode" value="overwrite"><span data-i18n="apply.overwrite">元画像を上書き</span></label>
        <label class="form-row"><span data-i18n="apply.suffix">ファイル名の末尾</span><input id="applySuffix" type="text" value="_censored" required></label>
        <label id="deleteOriginalRow" class="choice-row"><input id="deleteOriginal" type="checkbox"><span data-i18n="apply.deleteOriginal">コピー成功後に元画像を削除</span></label>
        <p id="applyTemporarySourceNote" class="fixed-note" hidden data-i18n="apply.tempSource">ドラッグ追加画像は作業用の一時コピーです。読み込みフォルダへコピー保存します。</p>
        <label class="form-row"><span data-i18n="editor.blockSize">モザイク粗さ</span><span class="ratio-control"><span>1 /</span><input id="applyDivisor" type="number" min="1" max="10000" value="100" required><output id="applyBlockSize">-</output></span></label>
        <p class="fixed-note" data-i18n="apply.metadata">メタデータは保持・検証します。同名時は自動連番です。</p>
      </fieldset>
      <section id="applyProgressPanel" hidden>
        <p id="applyCurrentName" class="truncate"></p>
        <progress id="applyProgress" value="0" max="1"></progress>
        <p id="applyProgressText" class="muted"></p>
      </section>
      <p id="applyResult" class="dialog-result" aria-live="polite"></p>
      <div class="dialog-actions">
        <button id="applyCloseButton" type="button" data-i18n="dialog.close">閉じる</button>
        <button id="applyPauseButton" type="button" hidden data-i18n="apply.pause">一時停止</button>
        <button id="applyCancelButton" type="button" hidden class="danger" data-i18n="dialog.cancelJob">キャンセル</button>
        <button id="applyStartButton" type="submit" class="primary" data-i18n="apply.start">保存</button>
      </div>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
